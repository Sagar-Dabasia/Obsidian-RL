name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Test and Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency tree consistency
        run: python -m pip check

      - name: Check Python syntax compilation
        run: python -m compileall -q src tests

      - name: Run Ruff linter check
        run: python -m ruff check src tests

      - name: Run Ruff formatting check
        run: python -m ruff format --check src tests

      - name: Run Mypy static type checking
        run: python -m mypy src

      - name: Run test suite
        run: python -m pytest -q

      - name: Build distribution packages (sdist and wheel)
        run: python -m build

      - name: Smoke test installed wheel outside repository
        shell: bash
        run: |
          python -m venv wheel_venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PYTHON="wheel_venv/Scripts/python.exe"
            VENV_CLI="wheel_venv/Scripts/obsidian-rl.exe"
          else
            VENV_PYTHON="wheel_venv/bin/python"
            VENV_CLI="wheel_venv/bin/obsidian-rl"
          fi
          "$VENV_PYTHON" -m pip install --upgrade pip
          WHEEL_FILE=$(ls dist/obsidian_rl-*.whl | head -n 1)
          "$VENV_PYTHON" -m pip install "$WHEEL_FILE"
          mkdir -p ../clean_workspace
          cd ../clean_workspace
          ../Obsidian-RL/"$VENV_PYTHON" -c "import obsidian_rl; print('Successfully imported obsidian_rl version:', obsidian_rl.__version__)"
          ../Obsidian-RL/"$VENV_PYTHON" -m obsidian_rl.cli --help
          if [ -f ../Obsidian-RL/"$VENV_CLI" ]; then
            ../Obsidian-RL/"$VENV_CLI" --help
          fi
